# Craft Harness Docker Compose stack.
#
# `docker compose up` brings up everything you need for the demo: a mock
# mail server, a mock kanban board, an S3-compatible object store, and the
# harness app itself.
#
# Default profile: full demo (mail + tickets + knowledge).
# Use `docker compose --profile minimal up` to skip the knowledge bucket.

name: craft-harness

services:
  greenmail:
    image: greenmail/standalone:2.1.5
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=aria@harness.local:aria,jaco@harness.local:jaco,demo@harness.local:demo -Dgreenmail.auth.disabled"
    ports:
      - "3025:3025" # SMTP
      - "3143:3143" # IMAP
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "sh", "-c", "echo > /dev/tcp/127.0.0.1/3025"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planka
      POSTGRES_USER: planka
      POSTGRES_PASSWORD: planka
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planka"]
      interval: 5s
      timeout: 3s
      retries: 10

  planka:
    image: ghcr.io/plankanban/planka:1.26.4
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BASE_URL: http://localhost:1337
      DATABASE_URL: postgresql://planka:planka@postgres/planka
      SECRET_KEY: dev-secret-change-me-not-for-production
      DEFAULT_ADMIN_EMAIL: demo@harness.local
      DEFAULT_ADMIN_PASSWORD: demo
      DEFAULT_ADMIN_NAME: Demo Admin
      DEFAULT_ADMIN_USERNAME: demo
    volumes:
      - planka-attachments:/app/public/user-avatars
      - planka-uploads:/app/private/attachments
    ports:
      - "1337:1337"
    healthcheck:
      test:
        ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:1337 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    profiles: ["full", "default"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-03T17-07-56Z
    profiles: ["full", "default"]
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./knowledge:/seed:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/knowledge &&
      mc cp --recursive /seed/ local/knowledge/ &&
      echo 'Knowledge bucket seeded.'
      "

  app:
    build: .
    # The app exits fatally if IMAP becomes unreachable (mail source retries,
    # then shuts the context down), so let Compose bring it back.
    restart: unless-stopped
    depends_on:
      greenmail:
        condition: service_healthy
      planka:
        condition: service_healthy
    environment:
      LOG_LEVEL: info

      # LLM
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-anthropic:claude-haiku-4-5-20251001}

      # Mail (Greenmail)
      MAIL_HOST: greenmail
      MAIL_IMAP_PORT: 3143
      MAIL_SMTP_PORT: 3025
      MAIL_USER: aria@harness.local
      MAIL_PASSWORD: aria
      MAIL_TLS: "false"
      MAIL_POLL_INTERVAL_MS: 5000

      # Planka
      PLANKA_BASE_URL: http://planka:1337
      PLANKA_USER: demo@harness.local
      PLANKA_PASSWORD: demo
      PLANKA_PROJECT_NAME: Craft Harness
      PLANKA_BOARD_NAME: Tasks
      PLANKA_WEBHOOK_SECRET: dev-secret-change-me

      # MinIO / S3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_KNOWLEDGE_BUCKET: knowledge
      S3_FORCE_PATH_STYLE: "true"

      # HTTP
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      MCP_PORT: 3001
    ports:
      - "3000:3000" # webhook receiver
      - "3001:3001" # MCP server

volumes:
  postgres-data:
  planka-attachments:
  planka-uploads:
  minio-data:
