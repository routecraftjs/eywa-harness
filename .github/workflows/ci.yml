# Checks every push and pull request.
#
# The harness is a public example, so the thing being demonstrated is that it
# compiles, lints, and passes its tests. A README claim nobody verifies is
# worth less than the diff it sits in.
#
# Deliberately no Docker step. The compose stack needs an Anthropic key, and a
# workflow that silently skips itself when a secret is absent reads as green
# while proving nothing. The tests here run against real files and real routes
# and need no credentials at all.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format

      - name: Test
        run: bun run test
